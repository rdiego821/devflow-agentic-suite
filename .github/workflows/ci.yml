name: DevFlow Agentic Suite CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Test Backend (Spring Boot / Java 21)
  # -------------------------------------------------------------
  backend-ci:
    name: Backend CI (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot Backend
        run: mvn clean package -DskipTests
        working-directory: spring-boot-generator-engine

  # -------------------------------------------------------------
  # Job 2: Build & Lint Frontend (React / TypeScript / Vite)
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (React & TS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Typecheck and Build Frontend
        run: npm run build
        working-directory: ./frontend

  # -------------------------------------------------------------
  # Job 3: Docker Compose Validation
  # -------------------------------------------------------------
  docker-build:
    name: Docker Stack Build Test
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Build
        run: docker compose build